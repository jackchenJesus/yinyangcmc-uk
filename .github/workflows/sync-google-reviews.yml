name: Sync Google reviews

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch latest reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES_ID: ${{ secrets.GOOGLE_PLACES_ID }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          GBP_TOKEN_JSON: ${{ secrets.GBP_TOKEN_JSON }}
          GBP_OAUTH_CLIENT_JSON: ${{ secrets.GBP_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$GBP_TOKEN_JSON" ]; then
            mkdir -p secrets
            echo "$GBP_TOKEN_JSON" > secrets/gbp-oauth-token.json
          fi
          if [ -n "$GBP_OAUTH_CLIENT_JSON" ]; then
            mkdir -p secrets
            echo "$GBP_OAUTH_CLIENT_JSON" > secrets/gbp-oauth-client.json
          fi
          npm run reviews:sync

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync Google reviews"
          file_pattern: src/data/google-reviews.json
